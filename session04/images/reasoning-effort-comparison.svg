<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="gradL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">reasoning_effort: 「どれくらい考えるか」を1行で切替</text>

  <!-- Slider/scale -->
  <text x="100" y="100" fill="#dbeafe" font-size="16" font-weight="bold">none</text>
  <text x="1100" y="100" text-anchor="end" fill="#fde68a" font-size="16" font-weight="bold">xhigh</text>

  <rect x="100" y="110" width="1000" height="14" rx="7" fill="url(#gradL)"/>

  <!-- 5 tick marks -->
  <line x1="100" y1="105" x2="100" y2="135" stroke="#dbeafe" stroke-width="2"/>
  <text x="100" y="155" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="monospace">none</text>

  <line x1="350" y1="105" x2="350" y2="135" stroke="#dbeafe" stroke-width="2"/>
  <text x="350" y="155" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="monospace">low</text>

  <line x1="600" y1="105" x2="600" y2="135" stroke="#dbeafe" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" fill="#fde68a" font-size="14" font-family="monospace">medium</text>

  <line x1="850" y1="105" x2="850" y2="135" stroke="#dbeafe" stroke-width="2"/>
  <text x="850" y="155" text-anchor="middle" fill="#fde68a" font-size="14" font-family="monospace">high</text>

  <line x1="1100" y1="105" x2="1100" y2="135" stroke="#dbeafe" stroke-width="2"/>
  <text x="1100" y="155" text-anchor="middle" fill="#fde68a" font-size="14" font-family="monospace">xhigh</text>

  <!-- Arrows showing trade-off -->
  <text x="200" y="195" text-anchor="middle" fill="#a7f3d0" font-size="15">← 速い・安い・浅い</text>
  <text x="1000" y="195" text-anchor="middle" fill="#fcd34d" font-size="15">遅い・高い・深い →</text>

  <!-- Two scenarios: none vs high -->
  <!-- Left: none -->
  <rect x="60" y="230" width="540" height="320" rx="14" fill="#1e3a8a" fill-opacity="0.45" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="330" y="265" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="bold">reasoning_effort = "none"</text>

  <rect x="80" y="285" width="500" height="40" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="92" y="312" fill="#93c5fd" font-size="14" font-family="monospace">client.chat.completions.create(</text>

  <rect x="80" y="330" width="500" height="40" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="92" y="357" fill="#93c5fd" font-size="14" font-family="monospace">  reasoning_effort="none", ... )</text>

  <rect x="80" y="395" width="500" height="135" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="420" fill="#dbeafe" font-size="14">レイテンシ: <tspan font-weight="bold" font-size="16">0.8 秒</tspan></text>
  <text x="100" y="445" fill="#dbeafe" font-size="14">思考トークン: <tspan font-weight="bold" font-size="16">0</tspan></text>
  <text x="100" y="470" fill="#dbeafe" font-size="14">合計トークン: <tspan font-weight="bold" font-size="16">≈100</tspan> (安い)</text>
  <text x="100" y="495" fill="#dbeafe" font-size="14">向き: <tspan font-weight="bold">雑談 / 要約 / 翻訳 / 分類</tspan></text>
  <text x="100" y="520" fill="#fca5a5" font-size="14">難問: 外しがち</text>

  <!-- Right: high -->
  <rect x="620" y="230" width="540" height="320" rx="14" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="2.5"/>
  <text x="890" y="265" text-anchor="middle" fill="#a7f3d0" font-size="20" font-weight="bold">reasoning_effort = "high"</text>

  <rect x="640" y="285" width="500" height="40" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="652" y="312" fill="#6ee7b7" font-size="14" font-family="monospace">client.chat.completions.create(</text>

  <rect x="640" y="330" width="500" height="40" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="652" y="357" fill="#6ee7b7" font-size="14" font-family="monospace">  reasoning_effort="high", ... )</text>

  <rect x="640" y="395" width="500" height="135" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="420" fill="#a7f3d0" font-size="14">レイテンシ: <tspan font-weight="bold" font-size="16">6.2 秒</tspan></text>
  <text x="660" y="445" fill="#a7f3d0" font-size="14">思考トークン: <tspan font-weight="bold" font-size="16">数百〜数千</tspan> (課金対象)</text>
  <text x="660" y="470" fill="#a7f3d0" font-size="14">合計トークン: <tspan font-weight="bold" font-size="16">≈数千</tspan> (高い)</text>
  <text x="660" y="495" fill="#a7f3d0" font-size="14">向き: <tspan font-weight="bold">論理パズル / 数学 / コード難読バグ</tspan></text>
  <text x="660" y="520" fill="#86efac" font-size="14">難問: 正解しやすい</text>
</svg>

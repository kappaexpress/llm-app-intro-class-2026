<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <text x="650" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">messages 配列は毎ターン伸びていく → トークン量も伸びる</text>

  <!-- 1往復目 -->
  <text x="170" y="85" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">1往復目</text>
  <rect x="60" y="100" width="220" height="380" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>

  <rect x="75" y="115" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="135" fill="#dbeafe" font-size="11" font-family="monospace">user: 「こんにちは」</text>

  <text x="170" y="470" text-anchor="middle" fill="#a7f3d0" font-size="14">送信: <tspan font-weight="bold">1 件</tspan></text>

  <!-- 2往復目 -->
  <text x="430" y="85" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">2往復目</text>
  <rect x="320" y="100" width="220" height="380" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>

  <rect x="335" y="115" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="345" y="135" fill="#dbeafe" font-size="11" font-family="monospace">user: 「こんにちは」</text>

  <rect x="335" y="153" width="190" height="32" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="345" y="173" fill="#a7f3d0" font-size="11" font-family="monospace">assistant: 「こん…」</text>

  <rect x="335" y="191" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="345" y="211" fill="#dbeafe" font-size="11" font-family="monospace">user: 「天気は?」</text>

  <text x="430" y="470" text-anchor="middle" fill="#a7f3d0" font-size="14">送信: <tspan font-weight="bold">3 件</tspan></text>

  <!-- 3往復目 -->
  <text x="690" y="85" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">3往復目</text>
  <rect x="580" y="100" width="220" height="380" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>

  <rect x="595" y="115" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="605" y="135" fill="#dbeafe" font-size="11" font-family="monospace">user: 「こんにちは」</text>

  <rect x="595" y="153" width="190" height="32" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="605" y="173" fill="#a7f3d0" font-size="11" font-family="monospace">assistant: 「こん…」</text>

  <rect x="595" y="191" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="605" y="211" fill="#dbeafe" font-size="11" font-family="monospace">user: 「天気は?」</text>

  <rect x="595" y="229" width="190" height="32" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="605" y="249" fill="#a7f3d0" font-size="11" font-family="monospace">assistant: 「晴れ…」</text>

  <rect x="595" y="267" width="190" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="605" y="287" fill="#dbeafe" font-size="11" font-family="monospace">user: 「明日は?」</text>

  <text x="690" y="470" text-anchor="middle" fill="#a7f3d0" font-size="14">送信: <tspan font-weight="bold">5 件</tspan></text>

  <!-- 10往復目 -->
  <text x="950" y="85" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">10往復目</text>
  <rect x="840" y="100" width="220" height="380" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- many alternating bars -->
  <g transform="translate(855, 115)">
    <rect x="0" y="0" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="20" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="40" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="60" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="80" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="100" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="120" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="140" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="160" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="180" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="200" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="220" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="240" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="260" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="280" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="300" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="320" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="340" width="190" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="343" width="190" height="16" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  </g>

  <text x="950" y="470" text-anchor="middle" fill="#a7f3d0" font-size="14">送信: <tspan font-weight="bold">19 件 全部</tspan></text>

  <!-- Right: outcome -->
  <rect x="1080" y="100" width="200" height="380" rx="10" fill="#78350f" fill-opacity="0.45" stroke="#f59e0b" stroke-width="2"/>
  <text x="1180" y="135" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="bold">毎ターン増える</text>

  <text x="1100" y="170" fill="#fde68a" font-size="13">📈 送信トークン量</text>
  <text x="1100" y="195" fill="#fde68a" font-size="13">📈 料金</text>
  <text x="1100" y="220" fill="#fde68a" font-size="13">📈 応答レイテンシ</text>
  <text x="1100" y="245" fill="#fde68a" font-size="13">📉 残コンテキスト</text>

  <rect x="1100" y="270" width="160" height="190" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="1110" y="295" fill="#fcd34d" font-size="12">gpt-5.4-nano:</text>
  <text x="1110" y="320" fill="#fcd34d" font-size="12">入力 $0.20/1M</text>
  <text x="1110" y="345" fill="#fcd34d" font-size="12">出力 $1.25/1M</text>
  <text x="1110" y="380" fill="#fcd34d" font-size="12">コンテキスト:</text>
  <text x="1110" y="400" fill="#fcd34d" font-size="12">400K トークン</text>
  <text x="1110" y="430" fill="#fde68a" font-size="11">普段は気にしなくて</text>
  <text x="1110" y="445" fill="#fde68a" font-size="11">いいが「貼り付けは</text>
  <text x="1110" y="460" fill="#fde68a" font-size="11">重い」と覚える</text>

  <!-- Arrow showing growth -->
  <line x1="80" y1="450" x2="1050" y2="450" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
  <text x="565" y="510" text-anchor="middle" fill="#fde68a" font-size="15">↑ DevTools の Network タブで Payload の messages が「毎回長くなる」のを目で観察してみる</text>
  <text x="565" y="540" text-anchor="middle" fill="#93c5fd" font-size="14">これがコスト・速度の本質的な要因 — トークン量で全てが決まる世界</text>
</svg>

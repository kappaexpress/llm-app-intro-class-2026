<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">縦に積む: display: flex; flex-direction: column;</text>

  <!-- Outer column container -->
  <rect x="340" y="80" width="520" height="460" rx="14" fill="#1e3a8a" fill-opacity="0.18" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="600" y="73" text-anchor="middle" fill="#93c5fd" font-size="14">.app (flex column)</text>

  <!-- Header (slate, fixed height) -->
  <rect x="360" y="100" width="480" height="70" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="135" text-anchor="middle" fill="#cbd5e1" font-size="20" font-weight="bold">ヘッダー</text>
  <text x="600" y="158" text-anchor="middle" fill="#94a3b8" font-size="13">固定高さ</text>

  <!-- Message list (Primary blue, flex:1 stretches) -->
  <rect x="360" y="185" width="480" height="270" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="600" y="230" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="bold">メッセージリスト</text>
  <text x="600" y="262" text-anchor="middle" fill="#93c5fd" font-size="16" font-family="monospace">flex: 1</text>
  <text x="600" y="290" text-anchor="middle" fill="#93c5fd" font-size="15">残りの高さを全部使う</text>
  <text x="600" y="316" text-anchor="middle" fill="#93c5fd" font-size="15">overflow-y: auto (スクロール可)</text>

  <!-- Inner dummy bubbles to suggest scroll -->
  <rect x="385" y="345" width="200" height="22" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <rect x="615" y="375" width="200" height="22" rx="6" fill="#155e75" stroke="#06b6d4" stroke-width="1"/>
  <rect x="385" y="405" width="240" height="22" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <rect x="615" y="435" width="180" height="22" rx="6" fill="#155e75" stroke="#06b6d4" stroke-width="1"/>

  <!-- Input row -->
  <rect x="360" y="470" width="480" height="55" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="370" y="478" width="370" height="40" rx="8" fill="#155e75" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="555" y="503" text-anchor="middle" fill="#cffafe" font-size="16" font-weight="bold">入力欄</text>
  <rect x="748" y="478" width="84" height="40" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="790" y="503" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">送信</text>

  <!-- Side annotations -->
  <text x="320" y="139" text-anchor="end" fill="#cbd5e1" font-size="14">固定</text>
  <text x="320" y="320" text-anchor="end" fill="#93c5fd" font-size="14" font-weight="bold">伸び縮み</text>
  <text x="320" y="503" text-anchor="end" fill="#cffafe" font-size="14">固定</text>

  <!-- Right side: explanation -->
  <rect x="900" y="100" width="270" height="425" rx="12" fill="#155e75" fill-opacity="0.30" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1035" y="135" text-anchor="middle" fill="#cffafe" font-size="16" font-weight="bold">flex: 1 のキモ</text>

  <text x="920" y="175" fill="#cffafe" font-size="14">画面が縦に長くなったら</text>
  <text x="920" y="198" fill="#cffafe" font-size="14">→ 中央だけ伸びる</text>

  <text x="920" y="245" fill="#cffafe" font-size="14">画面が短くなったら</text>
  <text x="920" y="268" fill="#cffafe" font-size="14">→ 中央だけ縮む</text>

  <text x="920" y="320" fill="#fde68a" font-size="14">ヘッダーと入力欄は</text>
  <text x="920" y="343" fill="#fde68a" font-size="14">常に見える位置にある</text>

  <rect x="920" y="370" width="230" height="140" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
  <text x="935" y="395" fill="#7dd3fc" font-size="12" font-family="monospace">.app {</text>
  <text x="935" y="415" fill="#7dd3fc" font-size="12" font-family="monospace">  display: flex;</text>
  <text x="935" y="435" fill="#7dd3fc" font-size="12" font-family="monospace">  flex-direction: column;</text>
  <text x="935" y="455" fill="#7dd3fc" font-size="12" font-family="monospace">}</text>
  <text x="935" y="478" fill="#7dd3fc" font-size="12" font-family="monospace">.message-list {</text>
  <text x="935" y="498" fill="#7dd3fc" font-size="12" font-family="monospace">  flex: 1;</text>
</svg>

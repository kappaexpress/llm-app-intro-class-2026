<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="600" y="35" text-anchor="middle" fill="#93c5fd" font-size="22" font-weight="bold">役割分担: ブラウザが履歴を保持・サーバは system 挿入のみ</text>

  <!-- Three participant headers -->
  <!-- Browser -->
  <rect x="100" y="65" width="240" height="60" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="92" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="bold">ブラウザ</text>
  <text x="220" y="113" text-anchor="middle" fill="#93c5fd" font-size="12">messages 配列を保持</text>

  <!-- Server -->
  <rect x="480" y="65" width="240" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="92" text-anchor="middle" fill="#a7f3d0" font-size="18" font-weight="bold">サーバ (FastAPI)</text>
  <text x="600" y="113" text-anchor="middle" fill="#6ee7b7" font-size="12">system プロンプトを先頭に挿入</text>

  <!-- OpenAI -->
  <rect x="860" y="65" width="240" height="60" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="980" y="92" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="bold">OpenAI</text>
  <text x="980" y="113" text-anchor="middle" fill="#7dd3fc" font-size="12">gpt-5.4-nano</text>

  <!-- Lifelines (slate dashed) -->
  <line x1="220" y1="130" x2="220" y2="530" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="600" y1="130" x2="600" y2="530" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="980" y1="130" x2="980" y2="530" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Step 1: Browser -> Server (forward blue) -->
  <line x1="222" y1="180" x2="598" y2="180" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="270" y="155" width="280" height="22" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="410" y="172" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="monospace">POST /api/chat { messages: [...] }</text>

  <!-- Step 2: Server -> OpenAI (forward blue) -->
  <line x1="602" y1="240" x2="978" y2="240" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="660" y="215" width="260" height="22" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="790" y="232" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="monospace">[system, ...messages] (完全な配列)</text>

  <!-- Step 3: OpenAI -> Server (return emerald dashed) -->
  <line x1="978" y1="305" x2="602" y2="305" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-emerald)"/>
  <rect x="700" y="280" width="180" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="790" y="297" text-anchor="middle" fill="#a7f3d0" font-size="13">返答テキスト</text>

  <!-- Step 4: Server -> Browser (return emerald dashed) -->
  <line x1="598" y1="365" x2="222" y2="365" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-emerald)"/>
  <rect x="290" y="340" width="240" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="410" y="357" text-anchor="middle" fill="#a7f3d0" font-size="13" font-family="monospace">{ "reply": "..." }</text>

  <!-- Note near browser (amber) -->
  <rect x="60" y="415" width="320" height="60" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="220" y="442" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">messages.push(返答)</text>
  <text x="220" y="463" text-anchor="middle" fill="#fcd34d" font-size="13">→ 次の往復に備えて履歴を更新</text>

  <!-- Note hint near server -->
  <rect x="465" y="415" width="270" height="60" rx="10" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="442" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="bold">サーバは「覚えない」</text>
  <text x="600" y="462" text-anchor="middle" fill="#93c5fd" font-size="12">毎回 system を差し込んで転送するだけ</text>

  <!-- Bottom caption -->
  <text x="600" y="525" text-anchor="middle" fill="#cbd5e1" font-size="14">履歴の置き場はフロント。サーバはステートレス。</text>
</svg>

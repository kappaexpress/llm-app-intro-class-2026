<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="22" font-weight="bold">第6回 完成イメージ — 1つの会話・ブラウザの中だけ</text>

  <!-- Phone-app card -->
  <rect x="300" y="70" width="600" height="530" rx="20" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

  <!-- Header bar -->
  <rect x="300" y="70" width="600" height="80" rx="20" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="300" y="125" width="600" height="25" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0"/>
  <line x1="300" y1="150" x2="900" y2="150" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="bold">Chat App</text>
  <text x="600" y="135" text-anchor="middle" fill="#93c5fd" font-size="13">第6回版 — リロードで消えます</text>

  <!-- Message area background -->
  <rect x="300" y="150" width="600" height="370" fill="#0f172a"/>

  <!-- Assistant bubble 1 (slate, left) -->
  <rect x="325" y="175" width="320" height="50" rx="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="207" fill="#cbd5e1" font-size="16">こんにちは!</text>
  <text x="345" y="244" fill="#94a3b8" font-size="11">assistant</text>

  <!-- User bubble (cyan, right) -->
  <rect x="555" y="265" width="320" height="50" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="575" y="297" fill="#dbeafe" font-size="16">私の名前は田中</text>
  <text x="855" y="334" text-anchor="end" fill="#93c5fd" font-size="11">user</text>

  <!-- Assistant bubble 2 (slate, left) -->
  <rect x="325" y="355" width="370" height="50" rx="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="387" fill="#cbd5e1" font-size="16">よろしくお願いします</text>
  <text x="345" y="424" fill="#94a3b8" font-size="11">assistant</text>

  <!-- User bubble 2 (cyan, right) -->
  <rect x="595" y="445" width="280" height="50" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="615" y="477" fill="#dbeafe" font-size="16">名前覚えてる?</text>

  <!-- Input row -->
  <line x1="300" y1="520" x2="900" y2="520" stroke="#475569" stroke-width="1.5"/>
  <rect x="320" y="540" width="430" height="44" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="338" y="568" fill="#94a3b8" font-size="14">メッセージを入力...</text>
  <rect x="770" y="540" width="110" height="44" rx="10" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="825" y="568" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">送信</text>

  <!-- Side labels -->
  <text x="120" y="200" fill="#94a3b8" font-size="13">slate</text>
  <line x1="155" y1="195" x2="320" y2="195" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="120" y="290" fill="#93c5fd" font-size="13">primary blue</text>
  <line x1="195" y1="285" x2="555" y2="285" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="1080" y="200" fill="#94a3b8" font-size="13">左寄せ</text>
  <text x="1080" y="290" fill="#93c5fd" font-size="13">右寄せ</text>
  <text x="1080" y="565" fill="#dbeafe" font-size="13">送信ボタン</text>
</svg>

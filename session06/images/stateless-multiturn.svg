<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="650" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">LLM API はステートレス — 「覚えている」は錯覚</text>

  <!-- LEFT: Bad — single message only -->
  <text x="325" y="80" text-anchor="middle" fill="#fca5a5" font-size="18" font-weight="bold">❌ 今回の発言だけ送る</text>

  <rect x="50" y="100" width="560" height="200" rx="14" fill="#1e3a8a" fill-opacity="0.35" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="125" fill="#dbeafe" font-size="14" font-weight="bold">2往復目のリクエスト</text>

  <rect x="70" y="135" width="520" height="40" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="160" fill="#dbeafe" font-size="14" font-family="monospace">user: 「私の名前は?」</text>

  <text x="330" y="200" text-anchor="middle" fill="#93c5fd" font-size="14">↓ OpenAI に送る</text>

  <rect x="70" y="215" width="520" height="60" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="330" y="240" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="bold">「???」 (LLMは過去を知らない)</text>
  <text x="330" y="262" text-anchor="middle" fill="#fca5a5" font-size="13">→ デタラメ or 「分かりません」</text>

  <!-- RIGHT: Good — full history -->
  <text x="970" y="80" text-anchor="middle" fill="#a7f3d0" font-size="18" font-weight="bold">✅ 過去全部を毎回 送る</text>

  <rect x="690" y="100" width="560" height="380" rx="14" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="125" fill="#a7f3d0" font-size="14" font-weight="bold">2往復目のリクエスト (messages 配列)</text>

  <rect x="710" y="135" width="520" height="36" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="725" y="158" fill="#fde68a" font-size="13" font-family="monospace">system: 「丁寧なアシスタント」</text>

  <rect x="710" y="178" width="520" height="36" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="725" y="201" fill="#dbeafe" font-size="13" font-family="monospace">user: 「私の名前は田中です」</text>

  <rect x="710" y="221" width="520" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="725" y="244" fill="#a7f3d0" font-size="13" font-family="monospace">assistant: 「よろしくお願いします」</text>

  <rect x="710" y="264" width="520" height="36" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="725" y="287" fill="#dbeafe" font-size="13" font-family="monospace">user: 「私の名前は?」 ← 今回の発言</text>

  <text x="970" y="325" text-anchor="middle" fill="#6ee7b7" font-size="14">↓ OpenAI に丸ごと送る</text>

  <rect x="710" y="340" width="520" height="60" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="970" y="365" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="bold">「田中さんですね」</text>
  <text x="970" y="387" text-anchor="middle" fill="#6ee7b7" font-size="13">→ 文脈から推論できる ✓</text>

  <text x="970" y="437" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="bold">フロント (or サーバ)が履歴を保持し、毎回まるごと送る</text>
  <text x="970" y="461" text-anchor="middle" fill="#6ee7b7" font-size="13">= 「覚えている」ように見せる仕組み</text>

  <!-- Bottom note -->
  <rect x="50" y="510" width="1200" height="50" rx="8" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="650" y="540" text-anchor="middle" fill="#dbeafe" font-size="15">OpenAI サーバは「あなたが誰か / 前に何を話したか」を一切記憶しない。1リクエスト=独立したやり取り。</text>
</svg>

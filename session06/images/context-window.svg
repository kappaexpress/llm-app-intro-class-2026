<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">コンテキストウィンドウ: 1リクエストの上限トークン数</text>

  <!-- Outer container -->
  <rect x="180" y="80" width="840" height="430" rx="14" fill="#1e3a8a" fill-opacity="0.30" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="600" y="112" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="bold">コンテキストウィンドウ (400K トークン)</text>
  <line x1="200" y1="122" x2="1000" y2="122" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Row: system (Amber) -->
  <rect x="220" y="140" width="760" height="40" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="166" fill="#fde68a" font-size="15" font-family="monospace" font-weight="bold">[system プロンプト]</text>
  <text x="960" y="166" text-anchor="end" fill="#fde68a" font-size="15" font-family="monospace">50 トークン</text>

  <!-- Row: user1 (blue) -->
  <rect x="220" y="188" width="760" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="210" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="bold">[user1]</text>
  <text x="960" y="210" text-anchor="end" fill="#dbeafe" font-size="15" font-family="monospace">20 トークン</text>

  <!-- Row: assistant1 (emerald) -->
  <rect x="220" y="230" width="760" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="252" fill="#a7f3d0" font-size="15" font-family="monospace" font-weight="bold">[assistant1]</text>
  <text x="960" y="252" text-anchor="end" fill="#a7f3d0" font-size="15" font-family="monospace">100 トークン</text>

  <!-- Row: user2 (blue) -->
  <rect x="220" y="272" width="760" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="294" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="bold">[user2]</text>
  <text x="960" y="294" text-anchor="end" fill="#dbeafe" font-size="15" font-family="monospace">15 トークン</text>

  <!-- Row: assistant2 (emerald) -->
  <rect x="220" y="314" width="760" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="336" fill="#a7f3d0" font-size="15" font-family="monospace" font-weight="bold">[assistant2]</text>
  <text x="960" y="336" text-anchor="end" fill="#a7f3d0" font-size="15" font-family="monospace">200 トークン</text>

  <!-- Ellipsis -->
  <text x="600" y="376" text-anchor="middle" fill="#cbd5e1" font-size="20" font-family="monospace" font-weight="bold">...</text>

  <!-- Row: 今のuser発言 (blue, emphasized) -->
  <rect x="220" y="395" width="760" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="240" y="421" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="bold">[今の user 発言]</text>
  <text x="960" y="421" text-anchor="end" fill="#dbeafe" font-size="15" font-family="monospace">30 トークン</text>

  <!-- Used bar visualization -->
  <text x="220" y="468" fill="#cbd5e1" font-size="14">使用中:</text>
  <rect x="290" y="455" width="690" height="20" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <rect x="290" y="455" width="60" height="20" rx="6" fill="#3b82f6"/>
  <text x="660" y="470" text-anchor="middle" fill="#cbd5e1" font-size="13">↑ ここが膨らんで上限に近づく</text>

  <!-- Warning arrow + amber label -->
  <line x1="600" y1="525" x2="600" y2="565" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <rect x="280" y="568" width="640" height="40" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="595" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="bold">ここが膨らんで上限を超えるとエラー</text>
</svg>

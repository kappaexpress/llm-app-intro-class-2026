<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">メッセージバブル: 左 = assistant ・ 右 = user</text>

  <!-- Chat-like container -->
  <rect x="200" y="80" width="800" height="400" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="73" text-anchor="middle" fill="#94a3b8" font-size="13">.messages (flex column)</text>

  <!-- Top: .message.assistant — slate-gray, left -->
  <text x="220" y="125" fill="#cbd5e1" font-size="14" font-family="monospace" font-weight="bold">.message.assistant</text>
  <rect x="220" y="140" width="320" height="80" rx="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="188" text-anchor="middle" fill="#cbd5e1" font-size="22" font-weight="bold">こんにちは!</text>

  <!-- Annotation arrow + text -->
  <line x1="545" y1="180" x2="635" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="650" y="172" fill="#cbd5e1" font-size="15">灰色・左寄せ</text>
  <text x="650" y="192" fill="#94a3b8" font-size="13" font-family="monospace">align-self: flex-start</text>

  <!-- Bottom: .message.user — blue, right -->
  <rect x="660" y="320" width="320" height="80" rx="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="820" y="368" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="bold">元気ですか?</text>
  <text x="980" y="425" text-anchor="end" fill="#93c5fd" font-size="14" font-family="monospace" font-weight="bold">.message.user</text>

  <!-- Annotation arrow + text -->
  <line x1="655" y1="360" x2="565" y2="360" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="550" y="352" text-anchor="end" fill="#93c5fd" font-size="15">青色・右寄せ</text>
  <text x="550" y="372" text-anchor="end" fill="#60a5fa" font-size="13" font-family="monospace">align-self: flex-end</text>

  <!-- Bottom note -->
  <rect x="60" y="500" width="1080" height="32" rx="8" fill="#1e3a8a" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="600" y="522" text-anchor="middle" fill="#dbeafe" font-size="15">外側の .message で左右の寄せを決め、内側の .message-bubble で色と形を決める</text>
</svg>

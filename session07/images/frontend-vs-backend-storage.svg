<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="650" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">アーキテクチャの変化: 履歴の置き場が「ブラウザ」から「サーバ」へ</text>

  <!-- ===== LEFT: Session 6 (frontend holds) ===== -->
  <text x="325" y="80" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="bold">第6回まで: フロントが履歴を持つ</text>

  <!-- Browser -->
  <rect x="50" y="105" width="230" height="350" rx="12" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="165" y="135" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">ブラウザ (JS)</text>

  <rect x="70" y="160" width="190" height="200" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="183" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">messages 配列</text>
  <text x="165" y="203" text-anchor="middle" fill="#93c5fd" font-size="11">(メモリ変数)</text>
  <rect x="85" y="215" width="160" height="20" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="92" y="230" fill="#dbeafe" font-size="11">user: ...</text>
  <rect x="85" y="240" width="160" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
  <text x="92" y="255" fill="#a7f3d0" font-size="11">assistant: ...</text>
  <rect x="85" y="265" width="160" height="20" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="92" y="280" fill="#dbeafe" font-size="11">user: ...</text>
  <rect x="85" y="290" width="160" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
  <text x="92" y="305" fill="#a7f3d0" font-size="11">assistant: ...</text>
  <text x="165" y="338" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">⚠ リロードで消滅</text>

  <text x="165" y="395" text-anchor="middle" fill="#cbd5e1" font-size="12">送信時:</text>
  <text x="165" y="415" text-anchor="middle" fill="#dbeafe" font-size="11">POST /api/chat</text>
  <text x="165" y="435" text-anchor="middle" fill="#dbeafe" font-size="11">body: {messages: [全件]}</text>

  <!-- Arrow to server -->
  <line x1="285" y1="280" x2="380" y2="280" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="332" y="265" text-anchor="middle" fill="#93c5fd" font-size="12">全件送る</text>

  <!-- Server (no storage) -->
  <rect x="390" y="180" width="200" height="200" rx="12" fill="#155e75" fill-opacity="0.5" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="490" y="215" text-anchor="middle" fill="#cffafe" font-size="16" font-weight="bold">FastAPI</text>
  <text x="490" y="245" text-anchor="middle" fill="#7dd3fc" font-size="13">何も覚えない</text>
  <text x="490" y="265" text-anchor="middle" fill="#7dd3fc" font-size="13">(ステートレス)</text>
  <text x="490" y="305" text-anchor="middle" fill="#cffafe" font-size="12">受け取った配列を</text>
  <text x="490" y="325" text-anchor="middle" fill="#cffafe" font-size="12">そのまま OpenAI に</text>
  <text x="490" y="345" text-anchor="middle" fill="#cffafe" font-size="12">転送</text>

  <!-- ===== RIGHT: Session 7 (server holds) ===== -->
  <text x="970" y="80" text-anchor="middle" fill="#86efac" font-size="20" font-weight="bold">第7回〜: サーバが履歴を持つ</text>

  <!-- Browser (lighter) -->
  <rect x="690" y="105" width="200" height="350" rx="12" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="790" y="135" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">ブラウザ (JS)</text>

  <rect x="710" y="160" width="160" height="100" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="790" y="185" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="bold">画面の表示だけ</text>
  <text x="790" y="208" text-anchor="middle" fill="#93c5fd" font-size="11">(DOMに描画)</text>
  <text x="790" y="232" text-anchor="middle" fill="#93c5fd" font-size="11">起動時に</text>
  <text x="790" y="248" text-anchor="middle" fill="#93c5fd" font-size="11">GET で読み込む</text>

  <text x="790" y="300" text-anchor="middle" fill="#cbd5e1" font-size="12">送信時:</text>
  <text x="790" y="320" text-anchor="middle" fill="#dbeafe" font-size="11">POST /api/messages</text>
  <text x="790" y="340" text-anchor="middle" fill="#dbeafe" font-size="11">body: {content: "今の発言"}</text>

  <text x="790" y="395" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">✅ リロードで残る</text>
  <text x="790" y="415" text-anchor="middle" fill="#86efac" font-size="12">✅ 別端末から見れる</text>
  <text x="790" y="435" text-anchor="middle" fill="#86efac" font-size="12">✅ サーバ再起動でも残る</text>

  <line x1="895" y1="280" x2="950" y2="280" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="922" y="265" text-anchor="middle" fill="#93c5fd" font-size="11">1件だけ</text>

  <!-- Server -->
  <rect x="960" y="105" width="200" height="350" rx="12" fill="#155e75" fill-opacity="0.5" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="1060" y="135" text-anchor="middle" fill="#cffafe" font-size="16" font-weight="bold">FastAPI</text>
  <text x="1060" y="160" text-anchor="middle" fill="#7dd3fc" font-size="12">履歴の管理人</text>

  <rect x="980" y="180" width="160" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1060" y="205" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">① INSERT user</text>
  <text x="1060" y="225" text-anchor="middle" fill="#6ee7b7" font-size="11">届いた1件を保存</text>

  <rect x="980" y="250" width="160" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1060" y="275" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">② SELECT 全件</text>
  <text x="1060" y="295" text-anchor="middle" fill="#6ee7b7" font-size="11">DBから過去を読出し</text>

  <rect x="980" y="320" width="160" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1060" y="345" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">③ OpenAI 呼び出し</text>
  <text x="1060" y="365" text-anchor="middle" fill="#6ee7b7" font-size="11">+ 返答を INSERT</text>

  <line x1="1060" y1="385" x2="1060" y2="465" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="1100" y="425" fill="#cbd5e1" font-size="12">読み書き</text>

  <!-- SQLite -->
  <rect x="940" y="470" width="240" height="80" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="1060" y="498" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="bold">SQLite (chat.db)</text>
  <text x="1060" y="525" text-anchor="middle" fill="#fcd34d" font-size="13">messages テーブル</text>
  <text x="1060" y="542" text-anchor="middle" fill="#fcd34d" font-size="11">id / role / content / created_at</text>

  <!-- bottom: connecting browser-side note -->
  <rect x="50" y="475" width="850" height="80" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="475" y="500" text-anchor="middle" fill="#dbeafe" font-size="15" font-weight="bold">フロントは「画面表示」だけに専念 — 状態管理がシンプルになる</text>
  <text x="475" y="525" text-anchor="middle" fill="#93c5fd" font-size="13">送るのは「今の1発言」だけ。過去履歴はサーバが DB から取り出す</text>
  <text x="475" y="545" text-anchor="middle" fill="#fcd34d" font-size="13">第8回で複数会話に拡張する土台になる</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="22" font-weight="bold">Swagger UI: http://localhost:8000/docs</text>

  <!-- Browser-window frame -->
  <rect x="80" y="70" width="1040" height="520" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

  <!-- Browser top bar -->
  <rect x="80" y="70" width="1040" height="40" rx="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="105" cy="90" r="6" fill="#ef4444"/>
  <circle cx="125" cy="90" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="90" r="6" fill="#10b981"/>
  <rect x="180" y="78" width="600" height="24" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="195" y="95" fill="#cbd5e1" font-size="13" font-family="monospace">http://localhost:8000/docs</text>

  <!-- Header: app title -->
  <text x="110" y="148" fill="#dbeafe" font-size="22" font-weight="bold">Chat App</text>
  <line x1="110" y1="160" x2="1090" y2="160" stroke="#475569" stroke-width="1.5"/>

  <!-- POST /api/chat row -->
  <rect x="110" y="180" width="980" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="120" y="190" width="70" height="24" rx="4" fill="#10b981"/>
  <text x="155" y="208" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">POST</text>
  <text x="210" y="208" fill="#a7f3d0" font-size="15" font-family="monospace" font-weight="bold">/api/chat</text>
  <text x="1070" y="208" text-anchor="end" fill="#a7f3d0" font-size="20" font-weight="bold">▼</text>

  <!-- Try it out panel (request body) -->
  <rect x="130" y="244" width="940" height="170" rx="8" fill="#155e75" fill-opacity="0.30" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="150" y="272" fill="#cffafe" font-size="15" font-weight="bold">Try it out</text>
  <text x="150" y="298" fill="#7dd3fc" font-size="13">Request body (application/json):</text>

  <rect x="150" y="310" width="900" height="60" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
  <text x="165" y="332" fill="#cffafe" font-size="14" font-family="monospace">{</text>
  <text x="185" y="352" fill="#cffafe" font-size="14" font-family="monospace">  "message": "こんにちは"</text>
  <text x="165" y="366" fill="#cffafe" font-size="14" font-family="monospace">}</text>

  <!-- Execute button -->
  <rect x="150" y="380" width="120" height="30" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="210" y="401" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">Execute</text>

  <!-- Response 200 section -->
  <text x="110" y="450" fill="#93c5fd" font-size="16" font-weight="bold">Response</text>
  <rect x="110" y="465" width="980" height="100" rx="8" fill="#064e3b" fill-opacity="0.40" stroke="#10b981" stroke-width="1.5"/>
  <rect x="124" y="478" width="60" height="22" rx="4" fill="#10b981"/>
  <text x="154" y="494" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="bold">200</text>
  <text x="195" y="495" fill="#a7f3d0" font-size="14">OK</text>

  <rect x="124" y="510" width="952" height="46" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="140" y="540" fill="#a7f3d0" font-size="14" font-family="monospace">{ "reply": "こんにちは! 何かお手伝いできることはありますか?" }</text>
</svg>

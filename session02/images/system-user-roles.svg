<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">messages 配列に積む3つの role</text>

  <!-- Big container: messages array -->
  <rect x="60" y="80" width="800" height="430" rx="14" fill="#1e3a8a" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="80" y="110" fill="#93c5fd" font-size="16" font-weight="bold">messages = [ ... ]   (会話の中身。全部 LLM に渡す)</text>

  <!-- system message -->
  <rect x="90" y="130" width="740" height="100" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="90" y="130" width="120" height="100" rx="10" fill="#f59e0b"/>
  <text x="150" y="170" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">system</text>
  <text x="150" y="195" text-anchor="middle" fill="#0f172a" font-size="13">キャラ設定</text>
  <text x="150" y="213" text-anchor="middle" fill="#0f172a" font-size="13">(最初に1回)</text>
  <text x="230" y="170" fill="#fde68a" font-size="15" font-weight="bold">AIの性格・基本ルール</text>
  <text x="230" y="195" fill="#fde68a" font-size="14" font-family="monospace">あなたは丁寧な日本語で答えるアシスタントです。</text>
  <text x="230" y="215" fill="#fde68a" font-size="14" font-family="monospace">コードは必ず Python で示してください。</text>

  <!-- user message -->
  <rect x="90" y="250" width="740" height="80" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="90" y="250" width="120" height="80" rx="10" fill="#3b82f6"/>
  <text x="150" y="285" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="bold">user</text>
  <text x="150" y="307" text-anchor="middle" fill="#dbeafe" font-size="13">人間の発言</text>
  <text x="230" y="285" fill="#dbeafe" font-size="15" font-weight="bold">ユーザーが入力した質問・指示</text>
  <text x="230" y="312" fill="#dbeafe" font-size="14" font-family="monospace">リストを逆順にする方法を教えて</text>

  <!-- assistant message -->
  <rect x="90" y="350" width="740" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
  <rect x="90" y="350" width="120" height="80" rx="10" fill="#10b981"/>
  <text x="150" y="385" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">assistant</text>
  <text x="150" y="407" text-anchor="middle" fill="#0f172a" font-size="13">AIの過去発言</text>
  <text x="230" y="385" fill="#a7f3d0" font-size="15" font-weight="bold">過去にAIが返した内容 (履歴として渡す)</text>
  <text x="230" y="412" fill="#a7f3d0" font-size="14" font-family="monospace">`my_list[::-1]` で逆順にできます…</text>

  <!-- next user follow-up -->
  <rect x="90" y="450" width="740" height="50" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="90" y="450" width="120" height="50" rx="10" fill="#3b82f6"/>
  <text x="150" y="481" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="bold">user (次の発言)</text>
  <text x="230" y="481" fill="#dbeafe" font-size="14" font-family="monospace">じゃあタプルでは?</text>

  <!-- Right: LLM -->
  <line x1="870" y1="290" x2="930" y2="290" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="900" y="275" text-anchor="middle" fill="#93c5fd" font-size="13">丸ごと送る</text>

  <rect x="940" y="220" width="220" height="140" rx="70" fill="#155e75" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="1050" y="278" text-anchor="middle" fill="#cffafe" font-size="22" font-weight="bold">LLM</text>
  <text x="1050" y="308" text-anchor="middle" fill="#cffafe" font-size="14">全 role を読んで</text>
  <text x="1050" y="328" text-anchor="middle" fill="#cffafe" font-size="14">次の assistant を生成</text>

  <line x1="940" y1="395" x2="870" y2="395" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <text x="900" y="416" text-anchor="middle" fill="#a7f3d0" font-size="13">新しい assistant 返答</text>
</svg>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- サイドバー: 会話の一覧 -->
      <aside class="sidebar">
        <button id="new-chat-button" class="new-chat-button">
          + 新しい会話
        </button>
        <ul id="conversation-list" class="conversation-list"></ul>
      </aside>

      <!-- メイン: 選択中の会話 -->
      <main class="chat-area">
        <!-- エラーメッセージ表示エリア -->
        <div
          id="error-message"
          class="error-message"
          style="display: none"
        ></div>

        <!-- メッセージ表示エリア -->
        <div id="message-list" class="message-list">
          <div class="empty-state">
            左のメニューから会話を選ぶか、「+ 新しい会話」を押してください。
          </div>
        </div>

        <!-- 入力エリア -->
        <form id="chat-form" class="input-area">
          <textarea
            id="chat-input"
            class="chat-input"
            placeholder="メッセージを入力... (Enterで送信、Shift+Enterで改行)"
            rows="2"
            maxlength="4000"
          ></textarea>
          <button type="submit" class="send-button">送信</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

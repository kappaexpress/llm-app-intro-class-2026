<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">2テーブル構成: conversations (親) 1対多 messages (子)</text>

  <!-- conversations table (parent) -->
  <rect x="60" y="100" width="380" height="380" rx="14" fill="#78350f" fill-opacity="0.55" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="250" y="135" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="bold">conversations (会話)</text>
  <text x="250" y="158" text-anchor="middle" fill="#fcd34d" font-size="13">親テーブル</text>

  <!-- header row -->
  <rect x="80" y="180" width="50" height="35" fill="#f59e0b"/>
  <rect x="130" y="180" width="220" height="35" fill="#fbbf24"/>
  <rect x="350" y="180" width="70" height="35" fill="#f59e0b"/>
  <text x="105" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">id</text>
  <text x="240" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">title</text>
  <text x="385" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">system…</text>

  <!-- data rows -->
  <rect x="80" y="220" width="340" height="40" fill="#78350f" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="105" y="245" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">1</text>
  <text x="240" y="245" text-anchor="middle" fill="#fde68a" font-size="13">Pythonの質問</text>
  <text x="385" y="245" text-anchor="middle" fill="#fde68a" font-size="11">親切な…</text>

  <rect x="80" y="265" width="340" height="40" fill="#78350f" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="105" y="290" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">2</text>
  <text x="240" y="290" text-anchor="middle" fill="#fde68a" font-size="13">旅行プラン</text>
  <text x="385" y="290" text-anchor="middle" fill="#fde68a" font-size="11">旅行のプロ</text>

  <rect x="80" y="310" width="340" height="40" fill="#78350f" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="105" y="335" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">3</text>
  <text x="240" y="335" text-anchor="middle" fill="#fde68a" font-size="13">雑談</text>
  <text x="385" y="335" text-anchor="middle" fill="#fde68a" font-size="11">フレンドリー</text>

  <text x="250" y="400" text-anchor="middle" fill="#fcd34d" font-size="13">PK: id  /  各会話の メタ情報</text>
  <text x="250" y="425" text-anchor="middle" fill="#fde68a" font-size="13">title / system_prompt / created_at</text>
  <text x="250" y="455" text-anchor="middle" fill="#fde68a" font-size="13">→ サイドバーに表示する単位</text>

  <!-- Relation arrows -->
  <path d="M 440 250 Q 530 250 580 250" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M 440 295 Q 530 295 580 295" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M 440 335 Q 530 335 580 335" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="510" y="240" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">1 対 多</text>

  <!-- messages table (child) -->
  <rect x="590" y="100" width="560" height="380" rx="14" fill="#155e75" fill-opacity="0.5" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="870" y="135" text-anchor="middle" fill="#cffafe" font-size="20" font-weight="bold">messages (発言)</text>
  <text x="870" y="158" text-anchor="middle" fill="#7dd3fc" font-size="13">子テーブル</text>

  <!-- header row -->
  <rect x="610" y="180" width="50" height="35" fill="#06b6d4"/>
  <rect x="660" y="180" width="130" height="35" fill="#22d3ee"/>
  <rect x="790" y="180" width="80" height="35" fill="#06b6d4"/>
  <rect x="870" y="180" width="260" height="35" fill="#22d3ee"/>
  <text x="635" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">id</text>
  <text x="725" y="203" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">conversation_id</text>
  <text x="830" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">role</text>
  <text x="1000" y="203" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">content</text>

  <!-- rows for conv 1 -->
  <rect x="610" y="220" width="520" height="32" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="635" y="241" text-anchor="middle" fill="#cffafe" font-size="13">1</text>
  <text x="725" y="241" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">1</text>
  <text x="830" y="241" text-anchor="middle" fill="#cffafe" font-size="13">user</text>
  <text x="1000" y="241" text-anchor="middle" fill="#cffafe" font-size="12">Pythonとは?</text>

  <rect x="610" y="255" width="520" height="32" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="635" y="276" text-anchor="middle" fill="#cffafe" font-size="13">2</text>
  <text x="725" y="276" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">1</text>
  <text x="830" y="276" text-anchor="middle" fill="#cffafe" font-size="13">assistant</text>
  <text x="1000" y="276" text-anchor="middle" fill="#cffafe" font-size="12">Pythonとは…</text>

  <!-- rows for conv 2 -->
  <rect x="610" y="290" width="520" height="32" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="635" y="311" text-anchor="middle" fill="#cffafe" font-size="13">3</text>
  <text x="725" y="311" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">2</text>
  <text x="830" y="311" text-anchor="middle" fill="#cffafe" font-size="13">user</text>
  <text x="1000" y="311" text-anchor="middle" fill="#cffafe" font-size="12">北海道のおすすめ?</text>

  <rect x="610" y="325" width="520" height="32" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="635" y="346" text-anchor="middle" fill="#cffafe" font-size="13">4</text>
  <text x="725" y="346" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">2</text>
  <text x="830" y="346" text-anchor="middle" fill="#cffafe" font-size="13">assistant</text>
  <text x="1000" y="346" text-anchor="middle" fill="#cffafe" font-size="12">函館・小樽・…</text>

  <!-- row for conv 3 -->
  <rect x="610" y="360" width="520" height="32" fill="#155e75" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="635" y="381" text-anchor="middle" fill="#cffafe" font-size="13">5</text>
  <text x="725" y="381" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">3</text>
  <text x="830" y="381" text-anchor="middle" fill="#cffafe" font-size="13">user</text>
  <text x="1000" y="381" text-anchor="middle" fill="#cffafe" font-size="12">最近どう?</text>

  <text x="870" y="420" text-anchor="middle" fill="#7dd3fc" font-size="13">FK: conversation_id → conversations.id</text>
  <text x="870" y="445" text-anchor="middle" fill="#cffafe" font-size="13">WHERE conversation_id = N で「ある会話の発言だけ」を絞れる</text>
  <text x="870" y="470" text-anchor="middle" fill="#cffafe" font-size="13">これで複数会話 = 1つの DB で扱える</text>
</svg>

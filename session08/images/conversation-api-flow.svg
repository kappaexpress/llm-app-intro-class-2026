<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">1回の送信で起きる流れ: 会話単位 API</text>

  <!-- [ブラウザ] (top, blue) -->
  <rect x="380" y="70" width="440" height="100" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="600" y="105" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="bold">ブラウザ</text>
  <rect x="400" y="118" width="400" height="42" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="415" y="138" fill="#93c5fd" font-size="13" font-family="monospace">POST /api/conversations/5/messages</text>
  <text x="415" y="155" fill="#93c5fd" font-size="13" font-family="monospace">{ "content": "Pythonとは?" }</text>

  <!-- Arrow down to FastAPI -->
  <line x1="600" y1="172" x2="600" y2="210" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- [FastAPI] (middle, emerald) with numbered steps -->
  <rect x="280" y="215" width="640" height="280" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
  <text x="600" y="248" text-anchor="middle" fill="#a7f3d0" font-size="20" font-weight="bold">FastAPI (main.py)</text>

  <!-- Numbered steps -->
  <circle cx="320" cy="280" r="15" fill="#10b981"/>
  <text x="320" y="286" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">1</text>
  <text x="345" y="286" fill="#a7f3d0" font-size="15">会話5の system_prompt を SELECT</text>

  <circle cx="320" cy="315" r="15" fill="#10b981"/>
  <text x="320" y="321" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">2</text>
  <text x="345" y="321" fill="#a7f3d0" font-size="15">user メッセージを DB に INSERT</text>

  <circle cx="320" cy="350" r="15" fill="#10b981"/>
  <text x="320" y="356" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">3</text>
  <text x="345" y="356" fill="#a7f3d0" font-size="15">会話5の過去メッセージを全部 SELECT</text>

  <circle cx="320" cy="385" r="15" fill="#10b981"/>
  <text x="320" y="391" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">4</text>
  <text x="345" y="391" fill="#a7f3d0" font-size="14" font-family="monospace">messages_for_api = [system, user, asst, ..., 今のuser]</text>

  <circle cx="320" cy="420" r="15" fill="#10b981"/>
  <text x="320" y="426" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">5</text>
  <text x="345" y="426" fill="#a7f3d0" font-size="15">OpenAI に送信</text>

  <circle cx="320" cy="455" r="15" fill="#10b981"/>
  <text x="320" y="461" text-anchor="middle" fill="#064e3b" font-size="14" font-weight="bold">6</text>
  <text x="345" y="461" fill="#a7f3d0" font-size="15">返答を DB に INSERT</text>

  <!-- DB icon on right (amber) -->
  <rect x="780" y="280" width="120" height="120" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="840" y="318" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">chat.db</text>
  <text x="840" y="343" text-anchor="middle" fill="#fcd34d" font-size="12">conversations</text>
  <text x="840" y="362" text-anchor="middle" fill="#fcd34d" font-size="12">messages</text>
  <text x="840" y="388" text-anchor="middle" fill="#fcd34d" font-size="11">(SQLite)</text>

  <!-- DB arrows (slate-ish amber) -->
  <line x1="760" y1="318" x2="780" y2="318" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="780" y1="365" x2="760" y2="365" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- OpenAI on right (cyan) -->
  <rect x="950" y="280" width="220" height="120" rx="12" fill="#155e75" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="1060" y="320" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="bold">OpenAI</text>
  <text x="1060" y="345" text-anchor="middle" fill="#7dd3fc" font-size="13">gpt-5.4-nano</text>
  <text x="1060" y="370" text-anchor="middle" fill="#7dd3fc" font-size="13">chat.completions</text>

  <!-- Arrow FastAPI -> OpenAI (blue) -->
  <line x1="920" y1="420" x2="970" y2="395" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="945" y="418" fill="#93c5fd" font-size="12">5</text>

  <!-- Arrow OpenAI -> FastAPI (emerald) -->
  <line x1="970" y1="408" x2="920" y2="455" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-emerald)"/>
  <text x="945" y="450" fill="#a7f3d0" font-size="12">返答</text>

  <!-- Return arrow FastAPI -> Browser (emerald dashed) -->
  <line x1="600" y1="500" x2="600" y2="565" stroke="#34d399" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-emerald)"/>
  <rect x="640" y="510" width="200" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="740" y="538" text-anchor="middle" fill="#a7f3d0" font-size="14" font-family="monospace">{ id, role, content }</text>

  <!-- Browser receives (blue) -->
  <rect x="380" y="570" width="440" height="80" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="600" y="603" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="bold">ブラウザ: 画面に AI 返答を表示</text>
  <text x="600" y="628" text-anchor="middle" fill="#93c5fd" font-size="13">DOM に新しいメッセージバブルを append</text>

  <!-- Bottom caption -->
  <text x="600" y="690" text-anchor="middle" fill="#cbd5e1" font-size="14">「毎回まるごと送る」のは第6回と同じ ・ 会話ごとに範囲を絞るだけ</text>
</svg>

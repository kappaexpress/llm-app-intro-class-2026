<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="45" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">第7回まで: messages テーブル 1つだけ</text>

  <!-- Table title -->
  <text x="600" y="90" text-anchor="middle" fill="#fde68a" font-size="18" font-weight="bold">messages テーブル</text>

  <!-- Table outer frame -->
  <rect x="180" y="110" width="840" height="280" rx="10" fill="#155e75" fill-opacity="0.18" stroke="#06b6d4" stroke-width="2"/>

  <!-- Header row (cyan tint) -->
  <rect x="180" y="110" width="80"  height="50" fill="#06b6d4"/>
  <rect x="260" y="110" width="170" height="50" fill="#22d3ee"/>
  <rect x="430" y="110" width="320" height="50" fill="#06b6d4"/>
  <rect x="750" y="110" width="270" height="50" fill="#22d3ee"/>
  <text x="220" y="142" text-anchor="middle" fill="#0f172a" font-size="16" font-family="monospace" font-weight="bold">id</text>
  <text x="345" y="142" text-anchor="middle" fill="#0f172a" font-size="16" font-family="monospace" font-weight="bold">role</text>
  <text x="590" y="142" text-anchor="middle" fill="#0f172a" font-size="16" font-family="monospace" font-weight="bold">content</text>
  <text x="885" y="142" text-anchor="middle" fill="#0f172a" font-size="16" font-family="monospace" font-weight="bold">created_at</text>

  <!-- Column separators -->
  <line x1="260" y1="110" x2="260" y2="390" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="430" y1="110" x2="430" y2="390" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="750" y1="110" x2="750" y2="390" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Data row 1 -->
  <rect x="180" y="160" width="840" height="70" fill="#0f172a" stroke="#06b6d4" stroke-width="0.7"/>
  <text x="220" y="202" text-anchor="middle" fill="#cffafe" font-size="16" font-family="monospace" font-weight="bold">1</text>
  <text x="345" y="202" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="monospace">user</text>
  <text x="590" y="202" text-anchor="middle" fill="#cffafe" font-size="15" font-family="monospace">こんにちは</text>
  <text x="885" y="202" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="monospace">2026-05-28 10:00</text>

  <!-- Data row 2 -->
  <rect x="180" y="230" width="840" height="70" fill="#155e75" fill-opacity="0.25" stroke="#06b6d4" stroke-width="0.7"/>
  <text x="220" y="272" text-anchor="middle" fill="#cffafe" font-size="16" font-family="monospace" font-weight="bold">2</text>
  <text x="345" y="272" text-anchor="middle" fill="#a7f3d0" font-size="15" font-family="monospace">assistant</text>
  <text x="590" y="272" text-anchor="middle" fill="#cffafe" font-size="15" font-family="monospace">こんにちは!</text>
  <text x="885" y="272" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="monospace">2026-05-28 10:00</text>

  <!-- Data row 3 -->
  <rect x="180" y="300" width="840" height="70" fill="#0f172a" stroke="#06b6d4" stroke-width="0.7"/>
  <text x="220" y="342" text-anchor="middle" fill="#cffafe" font-size="16" font-family="monospace" font-weight="bold">3</text>
  <text x="345" y="342" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="monospace">user</text>
  <text x="590" y="342" text-anchor="middle" fill="#cffafe" font-size="15" font-family="monospace">Pythonとは?</text>
  <text x="885" y="342" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="monospace">2026-05-28 10:05</text>

  <!-- Annotation: arrow + amber warning -->
  <line x1="600" y1="420" x2="600" y2="460" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <rect x="200" y="465" width="800" height="60" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="492" text-anchor="middle" fill="#fde68a" font-size="17" font-weight="bold">全部ひとつなぎ。話題を分けたい!</text>
  <text x="600" y="514" text-anchor="middle" fill="#fcd34d" font-size="13">→ 第8回で conversations テーブルを足して切り分ける</text>
</svg>

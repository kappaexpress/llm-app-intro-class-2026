<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="650" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">RAG (Retrieval Augmented Generation) — 自分のドキュメントを参照させる</text>

  <!-- ============ Top: Indexing phase ============ -->
  <text x="650" y="85" text-anchor="middle" fill="#fcd34d" font-size="17" font-weight="bold">事前準備: ドキュメントをベクトル化して保存 (オフライン)</text>

  <!-- documents -->
  <rect x="40" y="100" width="200" height="120" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">ドキュメント</text>
  <text x="140" y="150" text-anchor="middle" fill="#fde68a" font-size="12">社内マニュアル</text>
  <text x="140" y="170" text-anchor="middle" fill="#fde68a" font-size="12">FAQ / 議事録</text>
  <text x="140" y="190" text-anchor="middle" fill="#fde68a" font-size="12">PDF / Markdown</text>

  <line x1="245" y1="160" x2="305" y2="160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="275" y="148" text-anchor="middle" fill="#fcd34d" font-size="11">チャンク分割</text>

  <rect x="310" y="100" width="200" height="120" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" fill="#cffafe" font-size="14" font-weight="bold">Embedding API</text>
  <text x="410" y="150" text-anchor="middle" fill="#cffafe" font-size="12">テキスト → 数値ベクトル</text>
  <text x="410" y="180" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="monospace">[0.12, -0.34, ...]</text>
  <text x="410" y="200" text-anchor="middle" fill="#7dd3fc" font-size="11">(意味を数値化)</text>

  <line x1="515" y1="160" x2="575" y2="160" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="580" y="100" width="250" height="120" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="705" y="125" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">Vector DB</text>
  <text x="705" y="150" text-anchor="middle" fill="#93c5fd" font-size="12">Chroma / pgvector /</text>
  <text x="705" y="167" text-anchor="middle" fill="#93c5fd" font-size="12">Pinecone など</text>
  <text x="705" y="195" text-anchor="middle" fill="#93c5fd" font-size="12">ベクトル + 元文書を蓄積</text>

  <!-- Divider -->
  <line x1="40" y1="260" x2="1260" y2="260" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ============ Bottom: Query phase ============ -->
  <text x="650" y="290" text-anchor="middle" fill="#86efac" font-size="17" font-weight="bold">実行時: 質問が来たら検索 → プロンプトに添付して LLM へ</text>

  <!-- User question -->
  <rect x="40" y="310" width="180" height="80" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="338" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">質問</text>
  <text x="130" y="365" text-anchor="middle" fill="#dbeafe" font-size="12">「有給の取り方は?」</text>

  <line x1="225" y1="350" x2="285" y2="350" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Vector search -->
  <rect x="290" y="310" width="220" height="80" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="400" y="338" text-anchor="middle" fill="#cffafe" font-size="14" font-weight="bold">ベクトル検索</text>
  <text x="400" y="362" text-anchor="middle" fill="#7dd3fc" font-size="12">質問を Embedding し、</text>
  <text x="400" y="378" text-anchor="middle" fill="#7dd3fc" font-size="12">近いドキュメントを取得</text>

  <line x1="515" y1="350" x2="575" y2="350" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <!-- Retrieved docs -->
  <rect x="580" y="305" width="220" height="90" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="330" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">ヒット ドキュメント</text>
  <text x="690" y="353" text-anchor="middle" fill="#fde68a" font-size="11">「就業規則 第15条:</text>
  <text x="690" y="370" text-anchor="middle" fill="#fde68a" font-size="11"> 有給は前日17時までに…」</text>
  <text x="690" y="386" text-anchor="middle" fill="#fcd34d" font-size="11">(社内資料)</text>

  <line x1="805" y1="350" x2="865" y2="350" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <!-- Prompt assembly -->
  <rect x="870" y="305" width="200" height="90" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="970" y="328" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="bold">プロンプト組立</text>
  <text x="970" y="350" text-anchor="middle" fill="#93c5fd" font-size="11">system + 検索結果</text>
  <text x="970" y="367" text-anchor="middle" fill="#93c5fd" font-size="11">+ 質問</text>
  <text x="970" y="384" text-anchor="middle" fill="#93c5fd" font-size="11">→ LLM に投げる</text>

  <line x1="1075" y1="350" x2="1130" y2="350" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- LLM final -->
  <rect x="1135" y="305" width="125" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1197" y="335" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="bold">LLM</text>
  <text x="1197" y="362" text-anchor="middle" fill="#6ee7b7" font-size="11">資料に基づき</text>
  <text x="1197" y="378" text-anchor="middle" fill="#6ee7b7" font-size="11">正確に回答</text>

  <!-- Final answer back to user -->
  <path d="M 1197 400 Q 1197 460 130 460 L 130 395" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-emerald)"/>
  <text x="650" y="480" text-anchor="middle" fill="#a7f3d0" font-size="14">回答: 「前日17時までに上長へ連絡してください」</text>

  <!-- Bottom note -->
  <rect x="40" y="500" width="1220" height="50" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="650" y="528" text-anchor="middle" fill="#dbeafe" font-size="14">第2回の「プロンプトに必要な文脈を渡せば精度が上がる」を自動化 / 社内 Q&amp;A bot・FAQ・論文検索 等</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">Tool use / Function calling — AI に道具を渡す</text>

  <!-- ① user -->
  <rect x="40" y="100" width="220" height="80" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">① ユーザの質問</text>
  <text x="150" y="155" text-anchor="middle" fill="#dbeafe" font-size="13">「今日の東京の天気は?」</text>

  <line x1="265" y1="140" x2="335" y2="140" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ② AI thinks -->
  <rect x="340" y="100" width="280" height="80" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="480" y="128" text-anchor="middle" fill="#cffafe" font-size="14" font-weight="bold">② AI: 「これは知らない」</text>
  <text x="480" y="153" text-anchor="middle" fill="#cffafe" font-size="13">tools リストの中に</text>
  <text x="480" y="170" text-anchor="middle" fill="#cffafe" font-size="13">get_weather() がある</text>

  <line x1="625" y1="140" x2="695" y2="140" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ③ AI declares tool call -->
  <rect x="700" y="80" width="380" height="120" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="890" y="108" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">③ ツール呼び出しを宣言</text>
  <rect x="715" y="120" width="350" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="725" y="142" fill="#fde68a" font-size="13" font-family="monospace">tool_call: {</text>
  <text x="725" y="160" fill="#fde68a" font-size="13" font-family="monospace">  name: "get_weather",</text>
  <text x="725" y="178" fill="#fde68a" font-size="13" font-family="monospace">  args: {city: "東京"} }</text>

  <!-- ④ App executes tool -->
  <line x1="890" y1="205" x2="890" y2="245" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <rect x="700" y="250" width="380" height="100" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="890" y="278" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">④ アプリ側で関数を実行</text>
  <rect x="715" y="290" width="350" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="725" y="312" fill="#dbeafe" font-size="13" font-family="monospace">def get_weather(city):</text>
  <text x="725" y="330" fill="#dbeafe" font-size="13" font-family="monospace">  return api.fetch(city)</text>

  <!-- Result -->
  <line x1="890" y1="355" x2="890" y2="395" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <rect x="700" y="400" width="380" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="890" y="425" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="bold">⑤ 結果を AI に戻す</text>
  <text x="890" y="447" text-anchor="middle" fill="#6ee7b7" font-size="13" font-family="monospace">{"temp": 18, "cond": "晴れ"}</text>

  <!-- Back to AI then to user -->
  <path d="M 700 430 Q 480 430 480 200" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-emerald)"/>

  <!-- final answer -->
  <rect x="340" y="220" width="280" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="250" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="bold">⑥ AI が最終回答を生成</text>
  <text x="480" y="278" text-anchor="middle" fill="#a7f3d0" font-size="13">「東京は晴れ、18度です」</text>

  <line x1="335" y1="260" x2="265" y2="260" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- back to user -->
  <rect x="40" y="220" width="220" height="80" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="248" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="bold">⑦ ユーザに表示</text>
  <text x="150" y="275" text-anchor="middle" fill="#dbeafe" font-size="13">「東京は晴れ、18度です」</text>

  <!-- Bottom note -->
  <rect x="40" y="475" width="1120" height="50" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="600" y="503" text-anchor="middle" fill="#dbeafe" font-size="15">LLM の弱点 (最新情報・計算・外部操作) を「道具」で補う仕組み</text>
</svg>

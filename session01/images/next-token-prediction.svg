<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">LLM の核心: 次のトークンを確率的に選ぶ</text>

  <!-- Input prompt box -->
  <rect x="40" y="90" width="380" height="120" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="125" text-anchor="middle" fill="#93c5fd" font-size="16">入力 (これまでの文)</text>
  <text x="230" y="170" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="bold">「むかしむかし、</text>
  <text x="230" y="195" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="bold">あるところに」</text>

  <!-- Arrow to LLM -->
  <line x1="425" y1="150" x2="490" y2="150" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- LLM core -->
  <rect x="495" y="90" width="220" height="120" rx="60" fill="#155e75" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="605" y="135" text-anchor="middle" fill="#cffafe" font-size="22" font-weight="bold">LLM</text>
  <text x="605" y="165" text-anchor="middle" fill="#cffafe" font-size="15">(でかい</text>
  <text x="605" y="185" text-anchor="middle" fill="#cffafe" font-size="15">ニューラルネット)</text>

  <!-- Arrow to probabilities -->
  <line x1="720" y1="150" x2="790" y2="150" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Probability distribution -->
  <rect x="795" y="65" width="370" height="170" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="980" y="92" text-anchor="middle" fill="#6ee7b7" font-size="16">次に来そうな候補と確率</text>

  <!-- Bars -->
  <rect x="820" y="110" width="220" height="20" rx="4" fill="#10b981"/>
  <text x="830" y="125" fill="#064e3b" font-size="14" font-weight="bold">「お」</text>
  <text x="1150" y="125" text-anchor="end" fill="#a7f3d0" font-size="14">38%</text>

  <rect x="820" y="138" width="160" height="20" rx="4" fill="#10b981" fill-opacity="0.75"/>
  <text x="830" y="153" fill="#064e3b" font-size="14" font-weight="bold">「お爺」</text>
  <text x="1150" y="153" text-anchor="end" fill="#a7f3d0" font-size="14">21%</text>

  <rect x="820" y="166" width="100" height="20" rx="4" fill="#10b981" fill-opacity="0.55"/>
  <text x="830" y="181" fill="#064e3b" font-size="14" font-weight="bold">「昔」</text>
  <text x="1150" y="181" text-anchor="end" fill="#a7f3d0" font-size="14">12%</text>

  <rect x="820" y="194" width="60" height="20" rx="4" fill="#10b981" fill-opacity="0.4"/>
  <text x="830" y="209" fill="#064e3b" font-size="14" font-weight="bold">「猫」</text>
  <text x="1150" y="209" text-anchor="end" fill="#a7f3d0" font-size="14">5%</text>

  <!-- Sampling step -->
  <text x="980" y="270" text-anchor="middle" fill="#93c5fd" font-size="16">↓ 確率に従って1つ選ぶ</text>

  <!-- Selected token -->
  <rect x="880" y="290" width="200" height="60" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
  <text x="980" y="328" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="bold">「お」を出力</text>

  <!-- Loop arrow back -->
  <path d="M 880 320 Q 600 410 230 320 L 230 220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow-blue)"/>
  <text x="555" y="400" text-anchor="middle" fill="#cbd5e1" font-size="16">出力したトークンを入力末尾に足して、また次を予測 (1トークンずつ繰り返し)</text>

  <!-- Bottom note: continued example -->
  <rect x="60" y="440" width="1080" height="80" rx="10" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="470" text-anchor="middle" fill="#dbeafe" font-size="17">「むかしむかし、あるところに <tspan fill="#34d399" font-weight="bold">お</tspan>」 → 次は「じ」? 「ば」? → 「じ」を出力 → 「じいさん」…</text>
  <text x="600" y="500" text-anchor="middle" fill="#93c5fd" font-size="16">これを延々と繰り返すと「会話っぽい文章」が出来上がる ← 賢く考えているように見える正体</text>
</svg>

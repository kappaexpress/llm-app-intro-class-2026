<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="bold">標準モデル vs Reasoning モデル</text>

  <!-- ===== Left side: Standard ===== -->
  <text x="290" y="85" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="bold">従来 (標準モデル)</text>

  <!-- Question -->
  <rect x="80" y="110" width="420" height="60" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="290" y="148" text-anchor="middle" fill="#dbeafe" font-size="17">質問: 「複雑な論理パズル...」</text>

  <line x1="290" y1="175" x2="290" y2="215" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Model -->
  <rect x="80" y="220" width="420" height="70" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="290" y="252" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="bold">LLM</text>
  <text x="290" y="277" text-anchor="middle" fill="#cffafe" font-size="14">受け取って即トークン生成開始</text>

  <line x1="290" y1="295" x2="290" y2="335" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Answer -->
  <rect x="80" y="340" width="420" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="290" y="370" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="bold">回答 (素早い)</text>
  <text x="290" y="395" text-anchor="middle" fill="#6ee7b7" font-size="14">速い・安い・でも難問は外しがち</text>

  <!-- Stats -->
  <rect x="80" y="445" width="420" height="80" rx="10" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="100" y="473" fill="#cbd5e1" font-size="15">レイテンシ:</text>
  <text x="480" y="473" text-anchor="end" fill="#dbeafe" font-size="15" font-weight="bold">0.8秒</text>
  <text x="100" y="498" fill="#cbd5e1" font-size="15">追加思考トークン:</text>
  <text x="480" y="498" text-anchor="end" fill="#dbeafe" font-size="15" font-weight="bold">0</text>
  <text x="100" y="519" fill="#cbd5e1" font-size="15">難問の正解率:</text>
  <text x="480" y="519" text-anchor="end" fill="#dbeafe" font-size="15" font-weight="bold">低め</text>

  <!-- ===== Right side: Reasoning ===== -->
  <text x="910" y="85" text-anchor="middle" fill="#a7f3d0" font-size="20" font-weight="bold">Reasoning モデル</text>

  <!-- Question -->
  <rect x="700" y="110" width="420" height="60" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="910" y="148" text-anchor="middle" fill="#dbeafe" font-size="17">質問: 「複雑な論理パズル...」</text>

  <line x1="910" y1="175" x2="910" y2="215" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Internal thinking -->
  <rect x="700" y="220" width="420" height="160" rx="10" fill="#155e75" stroke="#06b6d4" stroke-width="2"/>
  <text x="910" y="248" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="bold">裏で「考える」フェーズ</text>
  <text x="910" y="275" text-anchor="middle" fill="#7dd3fc" font-size="14">(ユーザには見えない内部トークン)</text>

  <!-- Thinking bubbles -->
  <rect x="720" y="290" width="380" height="22" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <text x="730" y="307" fill="#dbeafe" font-size="13">① まず登場人物の関係を整理する...</text>

  <rect x="720" y="318" width="380" height="22" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <text x="730" y="335" fill="#dbeafe" font-size="13">② 太郎は花子の弟 → 兄弟。次郎は太郎の父...</text>

  <rect x="720" y="346" width="380" height="22" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <text x="730" y="363" fill="#dbeafe" font-size="13">③ 三郎は次郎の兄 → つまり花子の伯父だ</text>

  <line x1="910" y1="385" x2="910" y2="425" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Final answer -->
  <rect x="700" y="430" width="420" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
  <text x="910" y="455" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="bold">最終回答 (考えた末)</text>
  <text x="910" y="477" text-anchor="middle" fill="#6ee7b7" font-size="14">遅い・高い・でも正答率↑</text>

  <!-- Stats -->
  <rect x="700" y="500" width="420" height="50" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="523" fill="#a7f3d0" font-size="14">レイテンシ <tspan font-weight="bold">6.2秒</tspan> / 思考トークン <tspan font-weight="bold">数千</tspan> / 正解率 <tspan font-weight="bold">高い</tspan></text>
</svg>
